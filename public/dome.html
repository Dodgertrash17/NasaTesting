<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyBlink · Sky Dome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js" defer></script>
  <script src="js/dome.js" defer></script>
</head>
<body data-page="dome">
  <header id="site-header"></header>

  <main>
    <div class="dome" id="dome">
      <canvas class="dome-sky" id="dome-sky" tabindex="0"
              aria-label="All-sky view from an open field. Drag or use arrow keys to look around, scroll or plus and minus to zoom. Points of interest are listed in the Fly to menu."></canvas>

      <!-- Sub-nav from the sketch. Fades out when the mouse is still. -->
      <nav class="dome-toolbar" aria-label="Sky Dome">
        <a href="search.html#gallery">Gallery</a>
        <a aria-disabled="true" title="Planned">Exoplanet Explorer</a>
        <a href="search.html#filtered">Filtered Search</a>
        <a href="search.html#raw">Raw Search</a>
      </nav>

      <div class="dome-glass dome-status" id="dome-status" aria-live="polite"></div>

      <div class="dome-glass dome-hint" id="dome-hint">
        <strong>Drag to look around</strong> · scroll to zoom · click a glowing dot
      </div>

      <!-- Left: view controls -->
      <div class="dome-glass dome-left" role="group" aria-label="View controls">
        <label class="visually-hidden" for="fly-to">Fly to a point of interest</label>
        <select id="fly-to"><option value="">Fly to…</option></select>
        <div class="row">
          <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" id="reset-view" title="Back to the horizon">Horizon</button>
        </div>
        <label class="check"><input type="checkbox" id="show-ground" checked> Ground</label>
        <label class="check"><input type="checkbox" id="show-labels" checked> Labels</label>
        <label class="check"><input type="checkbox" id="show-grid"> Compass grid</label>
      </div>

      <!-- Bottom: the 102 SPHEREx bands -->
      <div class="dome-glass wave-bar all-bands" id="wave-bar" role="group" aria-label="Wavelength">
        <div class="wave-top">
          <button type="button" id="all-bands" aria-pressed="true" title="Add all 102 bands together">All bands</button>
          <span class="wave-read" id="wave-read"></span>
          <button type="button" id="band-blink" aria-pressed="false" title="Sweep through all 102 bands">▶ Sweep bands</button>
        </div>
        <label class="visually-hidden" for="band">SPHEREx band, 1 to 102</label>
        <input type="range" id="band" min="0" max="101" step="1" value="40">
        <div class="det-strip" id="det-strip" aria-hidden="true"></div>
      </div>

      <!-- Right: point of interest details -->
      <aside class="dome-glass poi-panel" id="poi-panel" hidden aria-labelledby="poi-name"></aside>
    </div>
  </main>
</body>
</html>
